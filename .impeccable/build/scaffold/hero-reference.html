<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: comp-a.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:wght@400&family=Karantina:wght@400&family=Faculty+Glyphic:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f8f8f8}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1280px">
  <div class="r-wordmark region text" data-region="wordmark"><!-- blue hand-lettered script wordmark 'Valentino', top-left --><p style="line-height:1.05;margin:0">wordmark</p></div>
  <div class="r-nav-pill region control" data-region="nav-pill"><!-- white pill nav with three uppercase links: SOBRE MÍ, PROYECTOS, CONTACTO: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop nav-pill); a control need not have button chrome --></div>
  <div class="r-lang-chip region control" data-region="lang-chip"><!-- white chip 'ES / EN' language switch: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop lang-chip); a control need not have button chrome --></div>
  <div class="r-contact-chip region control" data-region="contact-chip"><!-- white chip with blue dot and 'CONTACTO': match the control's lettering and visible shape to the crop (comp-spec.mjs --crop contact-chip); a control need not have button chrome --></div>
  <div class="r-kicker region text" data-region="kicker"><!-- serif kicker 'Valentino Araya / San Rafael, Mendoza' --><p style="font-size:var(--r-kicker-font);font-family:var(--r-kicker-family),sans-serif;font-weight:var(--r-kicker-weight);line-height:1.05;margin:0">kicker</p></div>
  <div class="r-headline-1 region text" data-region="headline-1"><!-- ultra-heavy condensed grotesk capitals 'CONSTRUYO SOFTWARE', black --><p style="font-size:var(--r-headline-1-font);font-family:var(--r-headline-1-family),sans-serif;font-weight:var(--r-headline-1-weight);line-height:1.05;margin:0">headline-1</p></div>
  <div class="r-headline-2 region text" data-region="headline-2"><!-- light condensed serif capitals 'QUE ESTÁ EN PRODUCCIÓN', black --><p style="font-size:var(--r-headline-2-font);font-family:var(--r-headline-2-family),sans-serif;font-weight:var(--r-headline-2-weight);line-height:1.05;margin:0">headline-2</p></div>
  <div class="r-subline region text" data-region="subline"><!-- small sans line 'Full Stack Developer · TypeScript, React y Node.js · 3 años construyendo para clientes reales.' --><p style="font-size:var(--r-subline-font);font-family:var(--r-subline-family),sans-serif;font-weight:var(--r-subline-weight);line-height:1.05;margin:0">subline</p></div>
  <div class="r-cv-button region control" data-region="cv-button"><!-- blue button: square down-arrow tile joined to label tile 'DESCARGAR CV': match the control's lettering and visible shape to the crop (comp-spec.mjs --crop cv-button); a control need not have button chrome --></div>
  <div class="r-proj-bookify region text" data-region="proj-bookify"><!-- blue bold sans 'Bookify' --><p style="font-size:var(--r-proj-bookify-font);line-height:1.05;margin:0">proj-bookify</p></div>
  <div class="r-proj-turepe region text" data-region="proj-turepe"><!-- blue italic script 'Tu Repe' --><p style="font-size:var(--r-proj-turepe-font);line-height:1.05;margin:0">proj-turepe</p></div>
  <div class="r-proj-liga region text" data-region="proj-liga"><!-- blue slab-ish bold 'Liga Gestión' --><p style="font-size:var(--r-proj-liga-font);line-height:1.05;margin:0">proj-liga</p></div>
  <div class="r-proj-cursada region text" data-region="proj-cursada"><!-- blue monospace 'Cursada' --><p style="font-size:var(--r-proj-cursada-font);line-height:1.05;margin:0">proj-cursada</p></div>
  <div class="r-proj-fortunato region text" data-region="proj-fortunato"><!-- blue light serif 'Don Fortunato' --><p style="font-size:var(--r-proj-fortunato-font);line-height:1.05;margin:0">proj-fortunato</p></div>
</main>
</body>
</html>
